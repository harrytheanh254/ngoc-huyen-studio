name: Tao Audio Ngoc Huyen Piper TTS

on:
  workflow_dispatch:
    inputs:
      text_file:
        description: 'Ten file kich ban'
        required: true
        default: 'truyenchu.txt'
      speed_choice:
        description: 'Chon toc do doc'
        required: true
        default: '1.0'
        type: choice
        options:
        - '1.0 (Chuan 1.0x)'
        - '1.25 (Nhanh 1.25x)'
        - '1.5 (Nhanh 1.5x)'
        - '2.0 (Nhanh 2.0x)'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai dat Python va ffmpeg
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cai dat thu vien phu thuoc
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install piper-tts ffmpeg-python
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi

      - name: Chay app.py tao audio
        run: |
          FILE_NAME="${{ github.event.inputs.text_file }}"
          SPEED_INPUT="${{ github.event.inputs.speed_choice }}"
          SPEED=$(echo $SPEED_INPUT | awk '{print $1}')

          # Chạy file app.py của repository ngoc-huyen-studio
          python app.py --file "$FILE_NAME" || python app.py

          # Tìm file audio vừa xuất ra
          TEMP_FILE=$(ls *.wav *.mp3 2>/dev/null | head -n 1)

          if [ -n "$TEMP_FILE" ]; then
            ffmpeg -i "$TEMP_FILE" -filter:a "atempo=$SPEED" -vn audio_ngoc_huyen.mp3 -y
          else
            echo "Khong tim thay file audio xuat ra tu app.py!"
            exit 1
          fi

      - name: Tai file MP3 ve
        uses: actions/upload-artifact@v4
        with:
          name: audio-ngoc-huyen
          path: audio_ngoc_huyen.mp3
